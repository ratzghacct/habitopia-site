<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Habitopia: email confirmed</title>
<style>
  :root{--bg:#FFF1E6;--ink:#2B2320;--muted:#6F5F55;--accent:#BA5F2B;--card:#fff}
  @media (prefers-color-scheme:dark){:root{--bg:#1E1814;--ink:#F6EBE3;--muted:#B9A79A;--accent:#E58B55;--card:#2A211C}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:24px}
  main{max-width:420px;background:var(--card);border-radius:32px;padding:40px 28px;text-align:center;box-shadow:0 10px 30px rgba(80,40,10,.1)}
  .tick{width:84px;height:84px;border-radius:50%;background:var(--accent);color:#fff;font-size:46px;line-height:84px;margin:0 auto 20px}
  h1{font-size:28px;margin:0 0 10px}
  p{margin:0 0 12px;color:var(--muted);line-height:1.5;font-size:17px}
  .brand{margin-top:22px;font-weight:700;color:var(--accent);letter-spacing:.02em}
  [hidden]{display:none}
</style>
</head>
<body>
<main>
  <div class="tick" aria-hidden="true">✓</div>
  <div lang="en" id="en">
    <h1>Email confirmed</h1>
    <p>Thank you! Your account is ready. Open the Habitopia app and sign in with your email and password.</p>
  </div>
  <div lang="de" id="de" hidden>
    <h1>E-Mail bestätigt</h1>
    <p>Danke! Dein Konto ist bereit. Öffne die Habitopia-App und melde dich mit deiner E-Mail-Adresse und deinem Passwort an.</p>
  </div>
  <div class="brand">Habitopia · Small steps. Big rewards.</div>
</main>
<script>
  // Show German when the phone is set to German, otherwise English.
  if ((navigator.language || '').toLowerCase().indexOf('de') === 0) {
    document.documentElement.lang = 'de';
    document.title = 'Habitopia: E-Mail bestätigt';
    document.getElementById('en').hidden = true;
    document.getElementById('de').hidden = false;
  }
</script>
</body>
</html>
